name: Deploy

# Checks, then builds the standalone server image (Dockerfile) and pushes it to GHCR. Deployment itself happens
# through a pull request to enderdincer/homelab-k8s-manifests (GitOps / Argo CD). When a GH_TOKEN secret with access
# to that repo is configured, this workflow opens that PR automatically; otherwise bump the tag there by hand.

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/zombieland
  MANIFESTS_REPOSITORY: enderdincer/homelab-k8s-manifests
  MANIFESTS_DEPLOYMENT_FILE: manifests/tools/zombieland/deployment.yaml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run check

  build-and-push:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Image tag
        id: meta
        run: echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manifests-pr:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Check for manifests token
        id: token
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: echo "present=$([ -n "$GH_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Skip (no GH_TOKEN secret)
        if: steps.token.outputs.present != 'true'
        run: echo "No GH_TOKEN secret; bump ${{ env.IMAGE }}:${{ needs.build-and-push.outputs.tag }} in the manifests repo manually."

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
        with:
          repository: ${{ env.MANIFESTS_REPOSITORY }}
          token: ${{ secrets.GH_TOKEN }}
          path: manifests

      - name: Open PR with the new image tag
        if: steps.token.outputs.present == 'true'
        working-directory: manifests
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          if [ ! -f "$MANIFESTS_DEPLOYMENT_FILE" ]; then
            echo "$MANIFESTS_DEPLOYMENT_FILE not found on main yet; skipping."
            exit 0
          fi
          sed -i -E "s#(image: ${IMAGE}):[^[:space:]]+#\1:${TAG}#" "$MANIFESTS_DEPLOYMENT_FILE"
          if git diff --quiet; then
            echo "Image already at ${TAG}"
            exit 0
          fi
          branch="release/zombieland-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "chore(deploy): update zombieland image to ${TAG}"
          git push origin "$branch"
          gh pr create --title "chore(deploy): update zombieland to ${TAG}" \
            --body "Automated image bump from ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
